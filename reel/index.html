<script>
"use strict";
// ───────────────────────────────────────────────────────────── constants
const W = 1920, H = 1080, CX = 960, CY = 540, DUR = 15, FPS = 60;
const NAME = "YORK-14";
const GA = Math.PI * (3 - Math.sqrt(5));              // golden angle, rad
const GA_DEG = 137.50776405003785;
const RENDER = location.hash === "#render";
if (RENDER) document.documentElement.classList.add("render-mode");

const CH = [ // chapters: start time, label, JP line
  { t: 0.0,  n: "SEED",            en: "ONE SEED",          jp: "ひとつの種から" },
  { t: 2.0,  n: "GOLDEN ANGLE",    en: "GROWS INTO ORDER",  jp: "秩序が育ち" },
  { t: 4.5,  n: "LOGISTIC MAP",    en: "ORDER DRIFTS",      jp: "秩序はゆらぎ" },
  { t: 6.5,  n: "DOUBLE PENDULUM", en: "INTO CHAOS",        jp: "混沌へ" },
  { t: 9.0,  n: "SYMMETRIC ICONS", en: "CHAOS BLOOMS",      jp: "混沌は咲き" },
  { t: 11.5, n: "GENERATIVE VASE", en: "INTO FORM",         jp: "かたちになる" },
  { t: 13.0, n: "END",             en: "",                  jp: "" },
];
// impacts drive flash / shake / aberration in post (time, strength)
const HITS = [[0.5,.35],[2.0,1],[4.5,.9],[6.5,1],[8.6,1.1],[9.0,.8],[9.5,.55],[10.0,.7],[10.38,.6],[11.5,.8],[13.0,1.3]];

// ───────────────────────────────────────────────────────────── math utils
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eInExpo = x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10);
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eInOutExpo = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2;
const eOutCubic = x => 1 - Math.pow(1 - x, 3);
const eOutBack = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const fract = x => x - Math.floor(x);
const hash = n => fract(Math.sin(n * 127.1 + 311.7) * 43758.5453123);
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const vnoise = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };

// ───────────────────────────────────────────────────────────── palette
// blue (order) ↔ pink (chaos), the two-colour axis of the Double Pendulum work
const BLUE = [199, 82, 70], PINK = [332, 84, 74];
function hsl2rgb(h, s, l) { h /= 360; s /= 100; l /= 100; const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const f = t => { t = fract(t); return t < 1/6 ? p + (q - p) * 6 * t : t < .5 ? q : t < 2/3 ? p + (q - p) * (2/3 - t) * 6 : p; };
  return [f(h + 1/3) * 255, f(h) * 255, f(h - 1/3) * 255]; }
const LUT = [], LUTA = [];
for (let i = 0; i < 256; i++) { const k = i / 255;
  const rgb = hsl2rgb(lerp(BLUE[0], PINK[0], k), lerp(BLUE[1], PINK[1], k), lerp(BLUE[2], PINK[2], k));
  LUTA.push(rgb); LUT.push(`rgb(${rgb[0] | 0},${rgb[1] | 0},${rgb[2] | 0})`); }
const col = k => LUT[clamp(k * 255 | 0, 0, 255)];
const C_PINK = col(1), C_BLUE = col(0), C_PAPER = "#efecf5", C_GOLD = "#f2cf8a", C_MUTED = "rgba(239,236,245,0.55)";
// density colour ramp for icons: ink → blue → pink → white
const DENS = new Uint8Array(256 * 3);
(() => { const st = [[0, [0, 0, 0]], [.32, [40, 120, 175]], [.62, [236, 120, 172]], [.86, [255, 214, 232]], [1, [255, 255, 255]]];
  for (let i = 0; i < 256; i++) { const k = i / 255; let j = 0; while (j < st.length - 2 && k > st[j + 1][0]) j++;
    const a = st[j], b = st[j + 1], u = clamp((k - a[0]) / (b[0] - a[0]));
    for (let c = 0; c < 3; c++) DENS[i * 3 + c] = lerp(a[1][c], b[1][c], u); } })();

// ───────────────────────────────────────────────────────────── canvases
const out = document.getElementById("out");
const sc = document.createElement("canvas"); sc.width = W; sc.height = H;
const c = sc.getContext("2d");
const F = { disp: '"Archivo", "Arial Narrow", sans-serif', serif: '"Instrument Serif", Georgia, serif',
            mono: '"JetBrains Mono", ui-monospace, monospace', jp: '"Zen Kaku Gothic New", "Hiragino Sans", sans-serif' };
function font(size, fam = F.mono, weight = 400, stretch = "normal", style = "normal") {
  c.font = `${style} ${weight} ${size}px ${fam}`; c.fontStretch = stretch; c.letterSpacing = "0px"; }

// ───────────────────────────────────────────────────────────── precompute: scene data
const R = mulberry32(0x9E3779B9);

// golden angle spiral
const NG = 2400, gX = new Float32Array(NG);
for (let i = 0; i < NG; i++) gX[i] = hash(i * 1.618 + 3.1);

// bifurcation diagram of x ← r x (1 − x), r ∈ [2.6, 4.0]
const NC = 1000, NS = 60, R0 = 2.6, R1 = 4.0, bY = new Float32Array(NC * NS);
for (let ci = 0; ci < NC; ci++) { const r = R0 + (R1 - R0) * ci / (NC - 1); let x = 0.31 + 0.2 * hash(ci);
  for (let k = 0; k < 400; k++) x = r * x * (1 - x);
  for (let s = 0; s < NS; s++) { x = r * x * (1 - x); bY[ci * NS + s] = x; } }
const rToX = r => 150 + (r - R0) / (R1 - R0) * 1620;
const xToY = x => 930 - x * 790;

// double pendulum, RK4 (m = l = 1, g = 9.81), main + ghost offset by ε = 1e-8 rad
const PEND = (() => { const g = 9.81;
  const d = (s, o) => { const a = s[0], b = s[1], w1 = s[2], w2 = s[3], D = a - b, den = 3 - Math.cos(2 * D);
    o[0] = w1; o[1] = w2;
    o[2] = (-g * 3 * Math.sin(a) - g * Math.sin(a - 2 * b) - 2 * Math.sin(D) * (w2 * w2 + w1 * w1 * Math.cos(D))) / den;
    o[3] = (2 * Math.sin(D) * (w1 * w1 * 2 + g * 2 * Math.cos(a) + w2 * w2 * Math.cos(D))) / den; };
  const k1 = [0,0,0,0], k2 = [0,0,0,0], k3 = [0,0,0,0], k4 = [0,0,0,0], tmp = [0,0,0,0];
  const step = (s, h) => { d(s, k1); for (let i = 0; i < 4; i++) tmp[i] = s[i] + h / 2 * k1[i]; d(tmp, k2);
    for (let i = 0; i < 4; i++) tmp[i] = s[i] + h / 2 * k2[i]; d(tmp, k3);
    for (let i = 0; i < 4; i++) tmp[i] = s[i] + h * k3[i]; d(tmp, k4);
    for (let i = 0; i < 4; i++) s[i] += h / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]); };
  const RATE = 240, SUB = 10, T = 15, N = RATE * T;
  const A = new Float32Array(N * 4), B = new Float32Array(N * 4); // [x1,y1,x2,y2] per sample
  const sa = [2.2, 2.6, 0, 0], sb = [2.2 + 1e-8, 2.6, 0, 0];
  const put = (arr, s, i) => { arr[i*4] = Math.sin(s[0]); arr[i*4+1] = Math.cos(s[0]); arr[i*4+2] = arr[i*4] + Math.sin(s[1]); arr[i*4+3] = arr[i*4+1] + Math.cos(s[1]); };
  for (let i = 0; i < N; i++) { put(A, sa, i); put(B, sb, i); for (let k = 0; k < SUB; k++) { step(sa, 1 / (RATE * SUB)); step(sb, 1 / (RATE * SUB)); } }
  return { A, B, RATE, N };
})();

// Field–Golubitsky symmetric icons: z ← (λ + α|z|² + β Re(zⁿ) + iω) z + γ z̄ⁿ⁻¹
const ICONS = [
  { p: [-1.806, 1.806, 0, 1, 0, 5],     n: 520000,  G: 640, sym: "D5"  },
  { p: [2.409, -2.5, 0, 0.9, 0, 23],    n: 520000,  G: 640, sym: "D23" },
  { p: [-2.05, 3, -16.79, 1, 0, 9],     n: 2600000, G: 900, sym: "D9"  },
];
for (const ic of ICONS) {
  const [l, a, b, g, w, n] = ic.p; let x = 0.1, y = 0.07;
  const xs = new Float32Array(ic.n), ys = new Float32Array(ic.n); let Rm = 0;
  for (let i = 0; i < ic.n + 500; i++) {
    let zr = 1, zi = 0, pr = 1, pi = 0;                     // zⁿ and z̄ⁿ⁻¹
    for (let k = 0; k < n - 1; k++) { const t = zr * x - zi * y; zi = zr * y + zi * x; zr = t; }
    pr = zr; pi = -zi;                                       // z̄ⁿ⁻¹ = conj(zⁿ⁻¹)
    const znr = zr * x - zi * y;                              // Re(zⁿ)
    const zz = x * x + y * y, p = l + a * zz + b * znr;
    const nx = p * x - w * y + g * pr, ny = p * y + w * x + g * pi;
    x = nx; y = ny;
    if (i >= 500) { xs[i - 500] = x; ys[i - 500] = y; const r2 = x * x + y * y; if (r2 > Rm) Rm = r2; }
  }
  Rm = Math.sqrt(Rm) * 1.03; const G = ic.G, cells = new Uint32Array(ic.n);
  for (let i = 0; i < ic.n; i++) { const gx = ((xs[i] / Rm) * 0.5 + 0.5) * G | 0, gy = ((ys[i] / Rm) * 0.5 + 0.5) * G | 0; cells[i] = clamp(gy, 0, G - 1) * G + clamp(gx, 0, G - 1); }
  ic.cells = cells; ic.hist = new Uint32Array(G * G); ic.k = 0; ic.max = 1;
  ic.cv = document.createElement("canvas"); ic.cv.width = ic.cv.height = G; ic.cx = ic.cv.getContext("2d");
  ic.img = ic.cx.createImageData(G, G); ic.lastK = -1;
}
function iconImage(ic, k) {
  k = clamp(k | 0, 0, ic.n);
  if (k < ic.k) { ic.hist.fill(0); ic.k = 0; ic.max = 1; }
  const h = ic.hist, cells = ic.cells; let m = ic.max;
  for (let i = ic.k; i < k; i++) { const v = ++h[cells[i]]; if (v > m) m = v; }
  ic.k = k; ic.max = m;
  if (ic.lastK !== k) {
    const d = ic.img.data, inv = 1 / Math.log(1 + m * 0.55), N = h.length;
    for (let i = 0, j = 0; i < N; i++, j += 4) { const v = h[i];
      if (v === 0) { d[j] = d[j+1] = d[j+2] = 0; d[j+3] = 255; continue; }
      const q = Math.min(255, Math.pow(Math.log(1 + v) * inv, 0.78) * 255) | 0;
      d[j] = DENS[q*3]; d[j+1] = DENS[q*3+1]; d[j+2] = DENS[q*3+2]; d[j+3] = 255; }
    ic.cx.putImageData(ic.img, 0, 0); ic.lastK = k;
  }
  return ic.cv;
}
// petals sampled from the hero icon's full density (they will scatter, then become the vase)
const NP = 6000, HERO = ICONS[2];
const P0 = new Float32Array(NP * 2), PV = new Float32Array(NP * 4);
(() => { const G = HERO.G, hist = new Uint32Array(G * G); let m = 0;
  for (let i = 0; i < HERO.n; i++) { const v = ++hist[HERO.cells[i]]; if (v > m) m = v; }
  const lm = Math.log(1 + m); let i = 0, guard = 0;
  while (i < NP && guard++ < 5e6) { const cell = R() * G * G | 0, v = hist[cell]; if (!v) continue;
    if (R() < Math.pow(Math.log(1 + v) / lm, 1.6)) { P0[i*2] = (cell % G) / G - .5; P0[i*2+1] = (cell / G | 0) / G - .5;
      PV[i*4] = R(); PV[i*4+1] = R(); PV[i*4+2] = R(); PV[i*4+3] = R(); i++; } } })();

// generative vase (after the Bamboo generator): r(θ,z) = R₀(z)·(1 + A·W(n(θ + τ(z))) + A₂·W₂)
const VT = 100, VZ = 60, V3 = new Float32Array(NP * 3);
(() => { const n = 6, twist = -122 * Math.PI / 180;
  const prof = z => 1 + 0.42 * Math.exp(-Math.pow((z - .26) / .24, 2)) - 0.30 * Math.exp(-Math.pow((z - .78) / .16, 2)) + 0.18 * Math.pow(z, 6);
  const Wp = u => Math.pow(Math.abs(Math.cos(u / 2)), 1.4) * 2 - 1;      // "petal" wave
  for (let iz = 0; iz < VZ; iz++) for (let it = 0; it < VT; it++) { const i = iz * VT + it, z = iz / (VZ - 1), th = it / VT * Math.PI * 2;
    const r = 150 * prof(z) * (1 + 0.075 * Wp(n * (th + twist * z)) + 0.02 * Math.sin(3 * (th - twist * z * .6)));
    V3[i*3] = r * Math.cos(th); V3[i*3+1] = (0.5 - z) * 600; V3[i*3+2] = r * Math.sin(th); } })();

// ───────────────────────────────────────────────────────────── text helpers
function txt(s, x, y, o = {}) {
  font(o.size || 16, o.fam || F.mono, o.weight || 400, o.stretch || "normal", o.style || "normal");
  if (o.ls) c.letterSpacing = o.ls + "px";
  c.textAlign = o.align || "left"; c.textBaseline = o.base || "alphabetic";
  c.globalAlpha = o.alpha == null ? 1 : o.alpha; c.fillStyle = o.color || C_PAPER;
  c.fillText(s, x, y); c.globalAlpha = 1; c.letterSpacing = "0px";
}
const GLYPHS = "0123456789ABCDEF#%&*+/<>=?";
function scramble(s, p, t, seed = 0) { let o = ""; const n = s.length;
  for (let i = 0; i < n; i++) { const ch = s[i]; if (ch === " " || i < p * n) { o += ch; continue; }
    if (i > p * n + 6) { o += " "; continue; }
    o += GLYPHS[(hash(i * 7.3 + Math.floor(t * 30) + seed) * GLYPHS.length) | 0]; }
  return o; }
// per-letter masked reveal: letters rise into place, then leave upward
function reveal(s, x, y, o, pin, pout = 0) {
  if (pin <= 0 || pout >= 1) return;

  for (const t of [9.0, 9.5, 10.0]) { kick(t, .9, t === 9.0); pluck(t, 74 + (t - 9) * 4, .14, 0, .6, "sine"); }
  for (let s = 0; s < 12; s++) hat(9.0 + s * .125 + .0625, .2, false, .2);

  for (const t of [11.5, 12.0, 12.5]) kick(t, t === 11.5 ? .9 : .7, t === 11.5);
  for (let s = 0; s < 12; s++) hat(11.5 + s * .125, s % 2 ? .22 : .1, s === 7, -.2);

  kick(13.0, 1.25, true); sub(13.0, 15.0, 26, .26);
  pad(13.0, 15.0, [50, 57, 64, 66, 69, 73, 76], .06, 3000, 900);

// ───────────────────────────────────────────────────────────── player
const JP_TEXT = CH.map(c => c.jp).join("") + "ひとつの種から数式に宿る、自然のかたち。";
const fontsReady = Promise.all([
  document.fonts.load('900 100px "Archivo"'), document.fonts.load('300 100px "Archivo"'), document.fonts.load('800 100px "Archivo"'),
  document.fonts.load('italic 400 100px "Instrument Serif"'), document.fonts.load('400 100px "Instrument Serif"'),
  document.fonts.load('400 20px "JetBrains Mono"', "SEED 0x9E3779B9 λαβγωθφδΔ←×·√∞⁻⁸₀²³ⁿ¹|z̄−→Ø≤"), document.fonts.load('500 20px "Zen Kaku Gothic New"', JP_TEXT),
]).catch(() => {});

window.REEL = { DUR, FPS, render, ready: false, buildAudio, wavBase64 };
const ui = { play: document.getElementById("play"), big: document.getElementById("bigPlay"), scrub: document.getElementById("scrub"),
             tc: document.getElementById("tc"), sound: document.getElementById("sound"), chapters: document.getElementById("chapters"), loading: document.getElementById("loading") };
let playing = false, t0 = 0, startAt = 0, actx = null, abuf = null, src = null, soundOn = true, cur = 10.45;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
CH.slice(0, 6).forEach((ch, i) => { const li = document.createElement("li"); li.innerHTML =
  `<button type="button"><span class="n">${String(i + 1).padStart(2, "0")} · ${ch.t.toFixed(1)}s</span><span class="t">${ch.n}</span><span class="s">${ch.jp}</span></button>`;
  li.querySelector("button").addEventListener("click", () => seek(ch.t + .001)); ui.chapters.appendChild(li); });
function setChapter(t) { [...ui.chapters.children].forEach((li, i) => li.classList.toggle("on", t >= CH[i].t && t < CH[i + 1].t)); }
function show(t) { cur = t; render(t); ui.scrub.value = t; const f = Math.floor(t * FPS); ui.tc.textContent = `${String(Math.floor(f / FPS)).padStart(2, "0")}:${String(f % FPS).padStart(2, "0")}`; setChapter(t); }
function startSound(at) { stopSound(); if (!soundOn || !actx || !abuf) return; src = actx.createBufferSource(); src.buffer = abuf; src.connect(actx.destination); src.start(0, at); }
function stopSound() { if (src) { try { src.stop(); } catch (e) {} src = null; } }
function clock() { return actx && soundOn ? actx.currentTime : performance.now() / 1000; }
async function play() {
  if (!actx && soundOn) { try { actx = new AudioContext(); abuf = abuf || await buildAudio(actx.sampleRate); } catch (e) { soundOn = false; syncSoundBtn(); } }
  if (actx && actx.state === "suspended") await actx.resume();
  if (cur >= DUR - .02) cur = 0;
  playing = true; startAt = cur; t0 = clock(); startSound(cur); ui.play.textContent = "Pause"; ui.big.hidden = true; requestAnimationFrame(tick);
}
function pause() { playing = false; stopSound(); ui.play.textContent = "Play"; }
function seek(t) { const was = playing; if (was) pause(); show(t); if (was) play(); }
function tick() { if (!playing) return; const t = startAt + (clock() - t0);
  if (t >= DUR) { show(DUR - 1e-3); pause(); ui.big.hidden = false; return; }
  show(t); requestAnimationFrame(tick); }
function syncSoundBtn() { ui.sound.setAttribute("aria-pressed", String(soundOn)); ui.sound.textContent = soundOn ? "Sound on" : "Sound off"; }
ui.play.addEventListener("click", () => playing ? pause() : play());
ui.big.addEventListener("click", () => play());
ui.scrub.addEventListener("input", () => { if (playing) pause(); show(+ui.scrub.value); });
ui.sound.addEventListener("click", () => { const was = playing; if (was) pause(); soundOn = !soundOn; syncSoundBtn(); if (was) play(); });
document.addEventListener("keydown", e => { if (e.code === "Space" && e.target === document.body) { e.preventDefault(); playing ? pause() : play(); } });

fontsReady.then(() => { ui.loading.hidden = true; show(RENDER ? 0 : (reduced ? 10.45 : 10.45)); window.REEL.ready = true; });
</script>
